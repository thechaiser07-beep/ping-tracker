<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PING — Sleep & Water</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ PIN SCREEN ══ -->
<div id="pin-screen">
    <div class="pin-brand">
        <div class="pin-title">PING</div>
        <div class="pin-sub">SLEEP &amp; WATER TRACKER</div>
    </div>
    <div class="pin-status" id="pin-status">&nbsp;</div>
    <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-pad">
        <button class="pin-key" data-v="1">1</button>
        <button class="pin-key" data-v="2">2</button>
        <button class="pin-key" data-v="3">3</button>
        <button class="pin-key" data-v="4">4</button>
        <button class="pin-key" data-v="5">5</button>
        <button class="pin-key" data-v="6">6</button>
        <button class="pin-key" data-v="7">7</button>
        <button class="pin-key" data-v="8">8</button>
        <button class="pin-key" data-v="9">9</button>
        <button class="pin-key pin-empty" aria-hidden="true"></button>
        <button class="pin-key" data-v="0">0</button>
        <button class="pin-key pin-del" id="pin-del">⌫</button>
    </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">PING</div>
            <span class="sync-dot" id="sync-dot"></span>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-btn active" data-tab="water">
                <span class="nav-icon">
                    <!-- drop -->
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L5.5 13A7 7 0 1 0 18.5 13L12 2z"/>
                    </svg>
                </span>
                <span class="nav-label">Water</span>
            </button>
            <button class="nav-btn" data-tab="sleep">
                <span class="nav-icon">
                    <!-- crescent -->
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </span>
                <span class="nav-label">Sleep</span>
            </button>
        </nav>

        <button class="nav-btn" id="settings-btn">
            <span class="nav-icon">
                <!-- sliders -->
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <line x1="4" y1="6" x2="20" y2="6"/>
                    <line x1="4" y1="12" x2="20" y2="12"/>
                    <line x1="4" y1="18" x2="20" y2="18"/>
                    <circle cx="8"  cy="6"  r="2.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="12" r="2.2" fill="currentColor" stroke="none"/>
                    <circle cx="10" cy="18" r="2.2" fill="currentColor" stroke="none"/>
                </svg>
            </span>
            <span class="nav-label">Settings</span>
        </button>
    </aside>

    <!-- ── MAIN CONTENT ── -->
    <div class="main-content">

        <!-- WATER PAGE -->
        <div class="page active" id="water-page">
            <div class="page-header">
                <div class="page-title">Water</div>
                <div class="app-date" id="app-date"></div>
            </div>

            <!-- Ring -->
            <div class="ring-wrapper">
                <svg class="water-ring-svg" viewBox="0 0 200 200">
                    <circle class="ring-bg"   cx="100" cy="100" r="82"/>
                    <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="82"
                        stroke-dasharray="515.22" stroke-dashoffset="515.22"/>
                </svg>
                <div class="ring-center">
                    <div class="ring-ml"   id="ring-ml">0</div>
                    <div class="ring-unit" id="ring-unit">bottles</div>
                    <div class="ring-pct"  id="ring-pct">0%</div>
                    <div class="ring-goal" id="ring-goal">/ 4 bottles</div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value accent" id="stat-water-streak">0 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">GOAL MET</div>
                    <div class="stat-value" id="stat-water-month">0 days</div>
                </div>
            </div>

            <!-- Monthly chart -->
            <div class="chart-card">
                <div class="month-nav-row">
                    <button class="month-nav-btn" id="water-prev">‹</button>
                    <span class="month-nav-title" id="water-month-label"></span>
                    <button class="month-nav-btn" id="water-next">›</button>
                </div>
                <canvas id="waterChart"></canvas>
            </div>

            <div class="neon-divider"></div>

            <div class="section-label">Quick Add</div>
            <div class="quick-add" id="quick-add-grid">
                <button class="add-btn" data-bottles="0.5">
                    <span>+½</span>
                    <small class="add-ml" data-for="0.5">250ml</small>
                </button>
                <button class="add-btn" data-bottles="1">
                    <span>+1</span>
                    <small class="add-ml" data-for="1">500ml</small>
                </button>
                <button class="add-btn" data-bottles="1.5">
                    <span>+1.5</span>
                    <small class="add-ml" data-for="1.5">750ml</small>
                </button>
                <button class="add-btn" data-bottles="2">
                    <span>+2</span>
                    <small class="add-ml" data-for="2">1000ml</small>
                </button>
            </div>

            <button class="undo-btn" id="undo-water">− Undo last entry</button>

            <div class="section-label" style="margin-top:14px">Custom Amount</div>
            <div class="custom-row">
                <input class="cyber-input" id="custom-ml" type="number" min="1" max="5000" placeholder="Enter ml...">
                <button class="cyber-btn" id="custom-add">ADD</button>
            </div>

            <div class="neon-divider"></div>

            <div class="section-label">Today's Log</div>
            <div class="log-list" id="water-log"></div>
        </div>

        <!-- SLEEP PAGE -->
        <div class="page" id="sleep-page">
            <div class="page-header">
                <div class="page-title">Sleep</div>
            </div>

            <!-- Sleep Ring -->
            <div class="ring-wrapper">
                <svg class="water-ring-svg" viewBox="0 0 200 200">
                    <circle class="ring-bg" cx="100" cy="100" r="82"/>
                    <circle class="ring-fill ring-fill-sleep" id="sleep-ring-fill" cx="100" cy="100" r="82"
                        stroke-dasharray="515.22" stroke-dashoffset="515.22"/>
                </svg>
                <div class="ring-center">
                    <div class="ring-ml"   id="sleep-ring-hours">—</div>
                    <div class="ring-unit">last night</div>
                    <div class="ring-pct"  id="sleep-ring-pct">0%</div>
                    <div class="ring-goal">/ 8h goal</div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value green" id="stat-sleep-streak">0 days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">AVG QUALITY</div>
                    <div class="stat-value" id="stat-sleep-quality">—</div>
                </div>
            </div>

            <div class="neon-divider"></div>

            <!-- Log form -->
            <div class="sleep-form">
                <div class="sleep-form-title">LOG SLEEP SESSION</div>

                <div class="sleep-form-top-row">
                    <div class="time-field" style="flex:1">
                        <label>DATE</label>
                        <input class="cyber-input" type="date" id="sleep-date">
                    </div>
                    <div class="time-field" style="flex:1">
                        <label>TYPE</label>
                        <select class="cyber-input cyber-select" id="sleep-type">
                            <option value="night">Night Sleep</option>
                            <option value="nap">Nap</option>
                        </select>
                    </div>
                </div>

                <div class="time-row">
                    <div class="time-field">
                        <label>BEDTIME</label>
                        <input class="cyber-input" type="time" id="bedtime" value="23:00">
                    </div>
                    <div class="time-field">
                        <label>WAKE TIME</label>
                        <input class="cyber-input" type="time" id="waketime" value="07:00">
                    </div>
                </div>

                <div class="sleep-duration" id="sleep-dur">8h 0m</div>

                <div class="quality-label">QUALITY</div>
                <div class="q-dots" id="q-dots">
                    <button class="q-dot active" data-v="1"></button>
                    <button class="q-dot active" data-v="2"></button>
                    <button class="q-dot active" data-v="3"></button>
                    <button class="q-dot active" data-v="4"></button>
                    <button class="q-dot active" data-v="5"></button>
                </div>

                <div class="quality-label" style="margin-top:10px">NOTES</div>
                <textarea class="cyber-input" id="sleep-notes" rows="2" placeholder="How did you sleep?"></textarea>

                <button class="cyber-btn purple" id="log-sleep" style="width:100%;padding:13px;font-size:13px;margin-top:12px;">
                    LOG SLEEP
                </button>
            </div>

            <div class="section-label">Recent Entries</div>
            <div class="log-list" id="sleep-log"></div>

            <!-- Sleep chart -->
            <div class="chart-card" style="margin-top:16px">
                <div class="chart-card-title">LAST 14 NIGHTS</div>
                <canvas id="sleepChart"></canvas>
            </div>

        </div>

    </div><!-- /main-content -->
</div><!-- /app -->

<!-- SETTINGS MODAL -->
<div class="overlay" id="settings-overlay">
    <div class="modal">
        <div class="modal-title">Settings</div>
        <button class="modal-close" id="modal-close">✕</button>

        <div class="setting-row">
            <label>BOTTLE SIZE</label>
            <div class="preset-row" id="bsize-presets">
                <button class="preset-btn" data-bsize="330">330ml</button>
                <button class="preset-btn" data-bsize="500">500ml</button>
                <button class="preset-btn" data-bsize="600">600ml</button>
                <button class="preset-btn" data-bsize="750">750ml</button>
                <button class="preset-btn" data-bsize="1000">1L</button>
            </div>
        </div>

        <div class="setting-row" style="margin-top:14px">
            <label>DAILY GOAL (BOTTLES)</label>
            <div class="preset-row" id="wgoal-presets">
                <button class="preset-btn" data-wgoal="2">2</button>
                <button class="preset-btn" data-wgoal="3">3</button>
                <button class="preset-btn" data-wgoal="4">4</button>
                <button class="preset-btn" data-wgoal="5">5</button>
                <button class="preset-btn" data-wgoal="6">6</button>
                <button class="preset-btn" data-wgoal="8">8</button>
            </div>
        </div>

        <div class="neon-divider"></div>

        <div class="setting-row">
            <label>CHANGE PIN</label>
            <div style="display:flex;gap:8px">
                <input class="cyber-input" id="new-pin" type="password" maxlength="4" inputmode="numeric" placeholder="New 4-digit PIN">
                <button class="cyber-btn pink" id="save-pin">SET</button>
            </div>
        </div>

        <div class="neon-divider"></div>

        <button class="cyber-btn pink" id="clear-water" style="width:100%;padding:12px;">
            CLEAR TODAY'S WATER
        </button>
    </div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
